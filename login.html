<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login - FLUFFI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Fredoka", sans-serif;
        background-color: #d8e7fc;
        transition: background-color 0.3s, color 0.3s;
      }

      .form-container {
        background: white;
        border-radius: 30px;
        padding: 2rem;
        max-width: 400px;
        margin: 5rem auto;
        box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.1);
        transition: background-color 0.3s, color 0.3s;
      }

      .form-title {
        color: #d34c86;
        font-weight: bold;
        font-size: 2rem;
        margin-bottom: 1.5rem;
        text-align: center;
      }

      .btn-custom {
        border-radius: 30px;
        font-weight: bold;
      }

      .btn-login {
        background-color: #f38fb3;
        color: white;
      }

      /* DARK MODE STYLING */
      body.dark-mode {
        background-color: #0a0606 !important;
        color: #f1f1f1 !important;
      }

      body.dark-mode .form-container {
        background-color: #1f1f1f;
        color: #f1f1f1;
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
      }

      body.dark-mode .form-label {
        color: #ddd;
      }

      body.dark-mode input.form-control {
        background-color: #333;
        color: #f1f1f1;
        border: 1px solid #555;
      }

      body.dark-mode input.form-control:focus {
        background-color: #444;
        border-color: #999;
        color: white;
      }

      body.dark-mode .btn-login {
        background-color: #d34c86;
      }
    </style>
  </head>

  <body>
    <div class="form-container">
      <div class="form-title">Login</div>
      <form id="loginForm">
        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input type="email" id="loginEmail" class="form-control" required />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            id="loginPassword"
            class="form-control"
            required
          />
        </div>
        <button type="submit" class="btn btn-custom btn-login w-100">
          Login
        </button>
      </form>
    </div>

    <!-- THEME SCRIPT -->
    <script src="theme.js"></script>
    <script>
      applySavedTheme(); // ensures dark mode is applied if previously saved
    </script>

    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", function (event) {
          event.preventDefault();

          const email = document.getElementById("loginEmail").value;
          const password = document.getElementById("loginPassword").value;

          // Retrieve users from localStorage
          let users = JSON.parse(localStorage.getItem("users") || "[]");

          // Check if user exists and credentials match
          const user = users.find(
            (user) => user.email === email && user.password === password
          );
          if (user) {
            // Store user data and redirect
            localStorage.setItem("currentUser", JSON.stringify(user));
            window.location.href = "home.html";
          } else {
            alert("Invalid email or password.");
          }
        });
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Signup - FLUFFI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Fredoka", sans-serif;
        background-color: #d8e7fc;
        transition: background-color 0.3s ease;
      }
    
      .form-container {
        background: white;
        border-radius: 30px;
        padding: 2rem;
        max-width: 400px;
        margin: 5rem auto;
        box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.1);
        transition: background-color 0.3s ease, color 0.3s ease;
      }
    
      .form-title {
        color: #89c6f0;
        font-weight: bold;
        font-size: 2rem;
        margin-bottom: 1.5rem;
        text-align: center;
      }
    
      .btn-custom {
        border-radius: 30px;
        font-weight: bold;
      }
    
      .btn-signup {
        background-color: #89c6f0;
        color: white;
      }
    
      /* DARK MODE STYLING */
      body.dark-mode {
        background-color: #0a0606 !important;
        color: #f1f1f1 !important;
      }
    
      body.dark-mode .form-container {
        background-color: #1f1f1f;
        color: #f5f5f5;
        box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.3);
      }
    
      body.dark-mode .form-title {
        color: #ffb6c1;
      }
    
      body.dark-mode input,
      body.dark-mode .form-control {
        background-color: #333;
        color: #f5f5f5;
        border: 1px solid #444;
      }
    
      body.dark-mode .btn-signup {
        background-color: #6b9ac4;
        color: white;
      }
    
      body.dark-mode .btn-signup:hover {
        background-color: #4b7f98;
      }
    
      body.dark-mode .header {
        background-color: #1f1f1f;
      }
    
      body.dark-mode .header h2 {
        color: #ffb6c1;
      }
    
      body.dark-mode .theme-toggle-btn {
        color: white;
      }
    
      .btn-outline-danger {
        border-radius: 25px;
      }
    </style>
    
  </head>
  <body>
    <div class="form-container">
      <div class="form-title">Sign Up</div>
      <form id="signupForm">
        <div class="mb-3">
          <label for="name" class="form-label">Full Name</label>
          <input type="text" id="name" class="form-control" required />
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input type="email" id="email" class="form-control" required />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-control" required />
        </div>
        <button type="submit" class="btn btn-custom btn-signup w-100">
          Sign Up
        </button>
      </form>
    </div>
 <!-- THEME SCRIPT -->
 <script src="theme.js"></script>
 <script>
   applySavedTheme();
 </script>
    <script>
      document
        .getElementById("signupForm")
        .addEventListener("submit", function (event) {
          event.preventDefault();

          const name = document.getElementById("name").value;
          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;

          // Retrieve existing users from localStorage
          let users = JSON.parse(localStorage.getItem("users") || "[]");

          // Check if email already exists
          const userExists = users.some((user) => user.email === email);
          if (userExists) {
            alert("Email already exists! Please use a different email.");
            return;
          }

          // Save new user
          users.push({ name, email, password });
          localStorage.setItem("users", JSON.stringify(users));

          // Automatically log in the new user
          localStorage.setItem("currentUser", JSON.stringify({ name, email }));

          // Redirect to home.html after successful signup
          window.location.href = "home.html";
        });
    </script>
  </body>
</html>

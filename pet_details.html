<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pet Details</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #79b9f6;
      font-family: Arial, sans-serif;
      padding: 2rem;
    }
    .pet-detail-card {
      
      background-color: #a0cff7;
      border: 5px rgb(255, 1, 128);
      border-radius: 50px;
      padding: 2rem;
      box-shadow: 0 5px 20px rgb(237, 107, 181);
      max-width: 1100px;
      margin: auto;
      
    }
    .pet-detail-card img {
      max-height: 400px;
      max-width: 400px;
      object-fit: cover;
      width: 100%;
      border-radius: 15px;
      border:5px solid rgba(252, 59, 155, 0.817);
    }
    .pet-detail-card h2 {
      color: rgb(205, 39, 122);
      margin-top: 1rem;
    }
    .apply-button {
      background-color: rgb(205, 39, 122);
      color: white;
      border: none;
      border-radius: 25px;
      padding: 10px 20px;
      font-size: 1.2rem;
      transition: background-color 0.3s ease;
    }
    .apply-button:hover {
      background-color: #761029;
    }
  </style>
</head>
<body>

  <div class="pet-detail-card text-center">
    <img id="petImage" alt="Pet Photo">
    <h2 id="petName"></h2>
    <p id="petPersonality"></p>
    <hr>
    <hr>
    <p><strong>Age:</strong> <span id="petAge"></span></p>
    <p><strong>Breed:</strong> <span id="petBreed"></span></p>
    <p><strong>Gender:</strong> <span id="petGender"></span></p>
    <p><strong>Health:</strong> <span id="petHealth"></span></p>
    <p><strong>Contact:</strong> <span id="petContact"></span></p>
    <button class="apply-button mt-3" data-bs-toggle="modal" data-bs-target="#adoptionModal">Apply to Adopt</button>

  </div>
<!-- Adoption Application Modal -->
<div class="modal fade" id="adoptionModal" tabindex="-1" aria-labelledby="adoptionModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <form class="modal-content needs-validation" novalidate onsubmit="handleFormSubmit(event)">
      <div class="modal-header">
        <h5 class="modal-title" id="adoptionModalLabel">Pet Adoption Form</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" style = "background-color: rgb(255, 174, 201)">

        <div class="mb-3">
          <label for="fullName" class="form-label">Full Name</label>
          <input type="text" class="form-control" id="fullName" required pattern="^[a-zA-Z ]{2,}$">
          <div class="invalid-feedback">Please enter a valid full name.</div>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input type="email" class="form-control" id="email" required>
          <div class="invalid-feedback">Enter a valid email address.</div>
        </div>

        <div class="mb-3">
          <label for="phone" class="form-label">Phone Number</label>
          <input type="tel" class="form-control" id="phone" required pattern="^[0-9]{10,15}$">
          <div class="invalid-feedback">Enter a valid phone number (10-15 digits).</div>
        </div>

        <div class="mb-3">
          <label for="address" class="form-label">Home Address</label>
          <input type="text" class="form-control" id="address" required>
          <div class="invalid-feedback">Please enter your home address.</div>
        </div>

        <div class="mb-3">
          <label for="experience" class="form-label">Do you have experience with pets?</label>
          <select class="form-select" id="experience" required>
            <option value="">Choose...</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
          </select>
          <div class="invalid-feedback">Please select an option.</div>
        </div>

        <div class="mb-3">
          <label for="reason" class="form-label">Why do you want to adopt this pet?</label>
          <textarea class="form-control" id="reason" rows="3" required minlength="10"></textarea>
          <div class="invalid-feedback">Please explain your reason (at least 10 characters).</div>
        </div>

      </div>
      <div class="modal-footer">
        <button type="submit" class="btn btn-primary" style = "background-color: rgb(255, 174, 201); color:black; border: black;">Submit Application</button>
      </div>
    </form>
  </div>
</div>

  <script>
    const pet = JSON.parse(localStorage.getItem("selectedPet"));
    if (!pet) {
      document.body.innerHTML = "<h2 class='text-center mt-5 text-danger'>No pet selected!</h2>";
    } else {
      document.getElementById("petImage").src = pet.image;
      document.getElementById("petName").textContent = pet.name;
      document.getElementById("petPersonality").textContent = pet.personality;
      document.getElementById("petAge").textContent = pet.age;
      document.getElementById("petBreed").textContent = pet.breed;
      document.getElementById("petGender").textContent = pet.gender;
      document.getElementById("petHealth").textContent = pet.health;
      document.getElementById("petContact").textContent = pet.contact;
    }
  </script>
  <script>
    // Bootstrap form validation
    (() => {
      'use strict';
      const forms = document.querySelectorAll('.needs-validation');
      Array.from(forms).forEach(form => {
        form.addEventListener('submit', event => {
          if (!form.checkValidity()) {
            event.preventDefault();
            event.stopPropagation();
          }
          form.classList.add('was-validated');
        }, false);
      });
    })();
  
    function handleFormSubmit(event) {
      event.preventDefault();
      if (event.target.checkValidity()) {
        const email = document.getElementById("email").value;
        alert("Your application will be reviewed. An email will be sent to " + email + ".");
        const modal = bootstrap.Modal.getInstance(document.getElementById('adoptionModal'));
        modal.hide();
        event.target.reset();
        event.target.classList.remove('was-validated');
      }
    }
  </script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
</body>
</html>

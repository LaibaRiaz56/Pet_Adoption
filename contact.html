<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact - Fluffi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #cce0ff;
      font-family: 'Segoe UI', sans-serif;
      transition: background-color 0.5s, color 0.5s;
    }

    .header {
      background-color: white;
      border-radius: 30px;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .contact-title {
  font-size: 2.5rem;
  font-weight: bold;
  color: #d15487;
  letter-spacing: 4px;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}


    .cute-bunny {
      width: 80px;
      height: auto;
    }

    .girl-img {
      width: 50%;
      height: 300px;
      border-radius: 15px;
      cursor: pointer;
    }

    .contact-section {
      background-color: #e27da6;
      color: white;
      padding: 3rem;
      border-radius: 30px;
    }

    .profile-info {
      margin-top: 1rem;
      font-size: 1.1rem;
    }

    .office-location {
      font-size: 1.1rem;
      margin-top: 3rem;
      text-align: center;
    }

    #scrollTopBtn {
      display: none;
      position: fixed;
      bottom: 30px;
      right: 30px;
      z-index: 99;
      border: none;
      outline: none;
      background-color: #ffb6c1;
      color: white;
      cursor: pointer;
      padding: 12px;
      border-radius: 50%;
    }

    .form-section {
      margin-top: 3rem;
      padding: 2rem;
      background-color: white;
      color: black;
      border-radius: 20px;
    }

    .accordion-button:focus {
      box-shadow: none;
    }

    .offcanvas-btn-header {
      background-color: #f1b1ee;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: bold;
    }

    /* DARK MODE STYLING */
    body.dark-mode {
      background-color: #0a0606 !important;
      color: #f1f1f1 !important;
    }

    body.dark-mode .accordion-button {
      background-color: #727070;
      color: #fff;
    }

    body.dark-mode .accordion-body {
      background-color: #1f1f1f;
      color: #f5f5f5;
    }

    body.dark-mode .header {
      background-color: #1f1f1f;
    }

    body.dark-mode .header h2 {
      color: #ffb6c1;
    }

    body.dark-mode .theme-toggle-btn {
      color: white;
    }

    .btn-outline-danger {
      border-radius: 25px;
    }
  </style>
</head>
<body>

<!-- Offcanvas Nav -->
<div class="offcanvas offcanvas-start" id="navMenu">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title">Menu</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body">
    <a href="home.html" class="d-block mb-2">Home</a>
    <a href="about.html" class="d-block mb-2">About</a>
    <a href="contact.html" class="d-block mb-2">Contact</a>
    <a href="process.html" class="d-block mb-2">Adoption process</a>
    <a href="available.html" class="d-block mb-2">Available pets</a>
    <hr />
  </div>
</div>

<div class="container my-5">
  <!-- Header -->
  <div class="header mb-4">
    <img src="ducky.jpeg" alt="bunny" class="cute-bunny">
    <div class="contact-title">CONTACT</div>

    <!-- Right Side Controls -->
    <div class="d-flex align-items-center ms-auto">
      <button class="btn theme-toggle-btn me-2" onclick="toggleDarkMode()" title="Toggle Dark Mode">
        <i class="fas fa-moon fa-lg"></i>
      </button>
      <img src="rabbit.jpeg" alt="bunny" class="cute-bunny">
    </div>
  </div>

  <!-- Contact Section -->
  <div class="contact-section">
    <div class="row text-center">
      <div class="col-md-4">
        <img src="girl1.avif" alt="Luna" class="girl-img" data-bs-toggle="tooltip" title="Luna - Design Head" />
        <div class="profile-info">
          <div><i class="fa-solid fa-envelope"></i> Zaynab@fluffi.com</div>
          <div><i class="fa-solid fa-phone"></i> 111 111 111</div>
        </div>
      </div>
      <div class="col-md-4">
        <img src="girl2.avif" alt="Bella" class="girl-img" data-bs-toggle="tooltip" title="Bella - Creative Lead" />
        <div class="profile-info">
          <div><i class="fa-solid fa-envelope"></i> Laiba@fluffi.com</div>
          <div><i class="fa-solid fa-phone"></i> 222 222 222</div>
        </div>
      </div>
      <div class="col-md-4">
        <img src="girl3.jpeg" alt="Zoe" class="girl-img" data-bs-toggle="tooltip" title="Zoe - Marketing Head" />
        <div class="profile-info">
          <div><i class="fa-solid fa-envelope"></i> Rameen@fluffi.com</div>
          <div><i class="fa-solid fa-phone"></i> 333 333 333</div>
        </div>
      </div>
    </div>

    <!-- Office Location -->
    <div class="office-location">
      <i class="fa-solid fa-location-dot"></i> CR 21, CS13E, RIMMS, NUST, H12, ISLAMABAD
    </div>
  </div>

  <!-- Contact Form -->
  <div class="form-section">
    <h4>Send us a message</h4>
    <form id="contactForm">
      <div class="mb-3">
        <label>Name</label>
        <input type="text" id="name" class="form-control" required />
      </div>
      <div class="mb-3">
        <label>Email</label>
        <input type="email" id="email" class="form-control" required />
      </div>
      <div class="mb-3">
        <label>Message</label>
        <textarea id="message" class="form-control" rows="3" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Submit</button>
      <div id="formMsg" class="mt-2"></div>
    </form>
  </div>
</div>

<!-- Scroll to Top -->
<button onclick="scrollToTop()" id="scrollTopBtn" title="Go to top"><i class="fas fa-arrow-up"></i></button>

<script src="theme.js"></script>
<script>
  applySavedTheme();
</script>

<!-- Bootstrap and Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Tooltip init
  const tooltips = document.querySelectorAll('[data-bs-toggle="tooltip"]');
  [...tooltips].forEach(t => new bootstrap.Tooltip(t));

  // Scroll to top
  const scrollTopBtn = document.getElementById("scrollTopBtn");
  window.onscroll = () => {
    scrollTopBtn.style.display = window.scrollY > 300 ? "block" : "none";
  };
  function scrollToTop() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // Form validation
  document.getElementById("contactForm").onsubmit = function (e) {
    e.preventDefault();
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const msg = document.getElementById("message").value.trim();
    const output = document.getElementById("formMsg");

    if (name.length < 2 || !email.includes("@") || msg.length < 5) {
      output.innerText = "Please enter valid details.";
      output.style.color = "red";
    } else {
      output.innerText = "Thank you! We’ll reach out soon.";
      output.style.color = "green";
      this.reset();
    }
  };
</script>
</body>
</html>

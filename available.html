<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Available Pets</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <style>
    body {
      font-family: 'Fredoka', sans-serif;
      background-color: #d8e7fc;
      padding: 2rem 0;
    }

    .section-header {
      background-color: white;
      border-radius: 30px;
      padding: 1.5rem;
      text-align: center;
      color: #b34476;
      font-size: 2rem;
      font-weight: bold;
      letter-spacing: 5px;
      margin-bottom: 2rem;
      position: relative;
    }

    .section-header img.left-icon {
      position: absolute;
      left: 20px;
      top: 10px;
      height: 70px;
    }

    .section-header img.right-icon {
      position: absolute;
      right: 20px;
      top: 10px;
      height: 70px;
    }

    .pet-card {
      border-radius: 30px;
      padding: 2rem 1rem;
      text-align: center;
      color: white;
      transition: transform 0.3s;
      position: relative;
    }

    .pet-card:hover {
      transform: translateY(-5px);
    }

    .pet-card img {
      height: 150px;
      margin-bottom: 1rem;
    }

    .pet-card h5 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }

    .bg-blue {
      background-color: #79b9f6;
    }

    .bg-pink {
      background-color: #f49eb6;
    }

    .adopt-button {
      font-size: 1.2rem;
      padding: 10px 20px;
      border-radius: 25px;
      background-color: #000000;
      color: white;
      border: none;
      transition: background-color 0.3s ease;
    }

    .adopt-button:hover {
      background-color: #761029;
    }
     /* DARK MODE STYLING */
     body.dark-mode {
      background-color: #0a0606 !important;
      color: #f1f1f1 !important;
    }

    body.dark-mode .accordion-button {
      background-color: #727070;
      color: #fff;
    }

    body.dark-mode .accordion-body {
      background-color: #1f1f1f;
      color: #f5f5f5;
    }

    body.dark-mode .header {
      background-color: #1f1f1f;
    }

    body.dark-mode .header h2 {
      color: #ffb6c1;
    }

    body.dark-mode .theme-toggle-btn {
      color: white;
    }

    .btn-outline-danger {
      border-radius: 25px;
    }
  </style>
</head>
<body>

<div class="container">

<!-- Header Section -->
<div class="section-header d-flex justify-content-between align-items-center p-3 mb-4" style="background-color: #ffeef6; border-radius: 15px;">
  <!-- Left Icon -->
  <img src="bunny.jpeg" class="img-fluid" alt="Bunny Icon" style="height: 50px;">

  <!-- Center Text -->
  <h2 class="text-center flex-grow-1 m-0" style="color: #c53675; font-weight: bold;">
    AVAILABLE PETS
  </h2>

  <!-- Right Icons: Moon toggle first, then Cat image -->
  <div class="d-flex align-items-center">
    <button class="btn me-2" onclick="toggleDarkMode()" title="Toggle Dark Mode" style="background: none; border: none;">
      <i class="bi bi-moon-fill fs-4" style="color: black;"></i>
    </button>
    <img src="cat.jpeg" class="img-fluid" alt="Cat Icon" style="height: 50px; border-radius: 50%;">
  </div>
</div>


  <!-- Pet Cards Grid -->

<div class="col-6 col-md-3">

</div>

</div>


<div class="col-6 col-md-3">

<div class="col-6 col-md-3">

</div>

<div class="col-6 col-md-3">
<div class="pet-card bg-blue shadow">

<div class="col-6 col-md-3">
<div class="pet-card bg-pink shadow">

<img src="birdy.jpeg" alt="Bird">
<button class="adopt-button w-100 mt-2" onclick='viewPetDetails({

</div>
</div>
  </div>
<!-- THEME SCRIPT -->
<script src="theme.js"></script>
<script>
  applySavedTheme();
</script>
  <script>
    // View pet details function
    function viewPetDetails(pet) {
      const user = JSON.parse(localStorage.getItem("currentUser"));
      if (!user) {
        alert("Please log in to adopt a pet.");
        return;
      }
  
      localStorage.setItem("selectedPet", JSON.stringify(pet));
      window.location.href = "pet_details.html";
    }
  
</script>
  
</body>
</html>
